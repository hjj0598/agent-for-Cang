spring.application.name=demo1

spring.servlet.multipart.max-file-size=70MB
spring.servlet.multipart.max-request-size=70MB

# DashScope OpenAI-compatible chat model
langchain4j.open-ai.chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.open-ai.chat-model.model-name=qwen3.7-flash-2026-07-15
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# DashScope OpenAI-compatible streaming chat model
langchain4j.open-ai.streaming-chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.streaming-chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.open-ai.streaming-chat-model.model-name=qwen3.7-flash-2026-07-15
langchain4j.open-ai.streaming-chat-model.log-requests=true
langchain4j.open-ai.streaming-chat-model.log-responses=true

# DashScope embedding model
langchain4j.open-ai.embedding-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.embedding-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.open-ai.embedding-model.model-name=text-embedding-v4
langchain4j.open-ai.embedding-model.log-requests=true
langchain4j.open-ai.embedding-model.log-responses=true
langchain4j.open-ai.embedding-model.max-segments-per-batch=10

# Redis in Docker Compose
spring.data.redis.host=redis
spring.data.redis.port=6379

# MySQL in Docker Compose
spring.datasource.url=jdbc:mysql://mysql:3306/agent_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# LangChain4j Redis vector store in Docker Compose
langchain4j.community.redis.host=redis
langchain4j.community.redis.port=6379

# Vision model for image analysis
app.vision.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
app.vision.api-key=${DASHSCOPE_API_KEY}
app.vision.model-name=qwen-vl-plus
app.vision.timeout-seconds=90
app.vision.max-file-size=10485760
