<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Chat</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #f4f6fb;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .page {
            width: 820px;
            margin: 40px auto;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 24px;
        }

        .title {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .session {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
            padding: 18px;
            box-sizing: border-box;
        }

        .message-row {
            display: flex;
            margin-bottom: 14px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 70%;
            padding: 12px 14px;
            border-radius: 8px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            background: #4f46e5;
            color: white;
        }

        .ai .bubble {
            background: #ffffff;
            color: #111827;
            border: 1px solid #e5e7eb;
        }

        .empty {
            color: #9ca3af;
            text-align: center;
            margin-top: 160px;
        }

        textarea {
            width: 100%;
            height: 90px;
            box-sizing: border-box;
            margin-top: 16px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #4f46e5;
        }

        .actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .send {
            background: #4f46e5;
            color: white;
        }

        .send:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }

        .new-chat {
            background: #eef2ff;
            color: #3730a3;
        }
    </style>
</head>
<body>

<div id="app" class="page">
    <h2 class="title">AI 聊天测试</h2>

    <div class="session">
        当前会话 memoryId：{{ memoryId }}
    </div>

    <div class="chat-box" ref="chatBox">
        <div v-if="messages.length === 0" class="empty">
            开始和 AI 聊天吧
        </div>

        <div
                v-for="(item, index) in messages"
                :key="index"
                class="message-row"
                :class="item.role">
            <div class="bubble">
                {{ item.content }}
            </div>
        </div>
    </div>

    <textarea
            v-model="message"
            placeholder="请输入你的问题"
            @keydown.enter.ctrl="sendMessage"></textarea>

    <div class="actions">
        <button class="send" @click="sendMessage" :disabled="loading || !message.trim()">
            {{ loading ? '请求中...' : '发送' }}
        </button>

        <button class="new-chat" @click="newChat">
            新会话
        </button>
    </div>
</div>

<script>
    const { createApp, nextTick } = Vue;

    createApp({
        data() {
            return {
                memoryId: "session-" + Date.now(),
                message: "我叫俊杰",
                messages: [],
                loading: false
            };
        },
        methods: {
            async sendMessage() {
                const userMessage = this.message.trim();
                if (!userMessage || this.loading) {
                    return;
                }

                this.messages.push({
                    role: "user",
                    content: userMessage
                });

                this.message = "";
                this.loading = true;
                this.scrollToBottom();

                try {
                    const response = await axios.get("/ai/chat", {
                        params: {
                            memoryId: this.memoryId,
                            message: userMessage
                        }
                    });

                    this.messages.push({
                        role: "ai",
                        content: response.data
                    });
                } catch (error) {
                    this.messages.push({
                        role: "ai",
                        content: "请求失败：" + error
                    });
                } finally {
                    this.loading = false;
                    this.scrollToBottom();
                }
            },

            newChat() {
                this.memoryId = "session-" + Date.now();
                this.message = "";
                this.messages = [];
            },

            scrollToBottom() {
                nextTick(() => {
                    const box = this.$refs.chatBox;
                    box.scrollTop = box.scrollHeight;
                });
            }
        }
    }).mount("#app");
</script>

</body>
</html>
